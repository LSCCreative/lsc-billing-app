<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LSC Billing</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/login.css">
<link rel="stylesheet" href="css/connection.css">
<link rel="stylesheet" href="css/estimates.css">
<link rel="stylesheet" href="css/pricing.css">
<link rel="stylesheet" href="css/settings.css">
<link rel="stylesheet" href="css/clients.css">
<!-- Last: the responsive band overrides. Every rule is inside a max-width
     media query, so the >=1100px desktop layout is untouched. -->
<link rel="stylesheet" href="css/responsive.css">
<!-- Last of all: the accessibility pass (contrast + focus rings). Overrides
     tokens/outlines the earlier files set, so it has to win every tie. -->
<link rel="stylesheet" href="css/a11y.css">
</head>
<body>

<!-- Login. Rendered by js/views/login.js; empty until the session check says
     there is no session. -->
<main id="login-view" hidden></main>

<!-- The app proper. The header is ported verbatim from the Electron build. -->
<div id="app-view" hidden>
  <header id="app-header">
    <span class="logo-text">LSC CREATIVE<em>.</em></span>
    <div id="hdr-right">
      <button class="nav-link" id="logo-btn" aria-label="LSC Creative"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span class="nav-label">LSC Creative</span></button>
      <button class="nav-link" id="nav-estimates">Estimates</button>
      <button class="nav-link" id="nav-clients">Clients</button>
      <button class="nav-link" id="nav-pricing">Pricing</button>
      <button class="nav-link" id="nav-invoice-settings">Invoice Settings</button>
      <!-- Not in the Electron header, which had no sessions. No data-write:
           it changes no data, and offline it explains itself instead.
           aria-label so the "Signed in as …" tooltip can't become its name. -->
      <button class="nav-link" id="nav-sign-out" aria-label="Sign Out">Sign Out</button>
    </div>
    <!-- The compact nav's toggle. Hidden at >=768px by css/responsive.css, where
         the whole mobile band lives; below it, #hdr-right becomes a panel this
         button opens. It is the last child so that #hdr-right going out of flow
         (position:fixed) leaves the header as wordmark + this button, and
         display:none keeps it out of the desktop header's flex row entirely.
         The SVG is aria-hidden, so aria-label is this button's only name. -->
    <button class="nav-link" id="nav-menu-btn" aria-label="Menu" aria-expanded="false" aria-controls="hdr-right"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg><span class="nav-label">Menu</span></button>
  </header>

  <!-- Raised by js/connection.js whenever the API is unreachable. role="status"
       so it is announced without stealing focus. -->
  <div id="connection-banner" role="status">
    <span class="cb-dot" aria-hidden="true"></span>
    <span id="connection-banner-message"></span>
    <button type="button" class="btn btn-sm" id="connection-banner-retry">Try Again</button>
  </div>

  <div id="main"></div>

  <!-- Invoice Settings. Filled by js/views/settings.js when it opens; inside
       #app-view so it can never surface over the login screen. -->
  <div class="modal-overlay" id="modal-invoice-settings"></div>
</div>

<!-- Write feedback. role="status" so a successful save is announced without
     interrupting, and it never carries the only copy of a failure message. -->
<div class="export-toast" id="export-toast" role="status">
  <div class="toast-dot" id="toast-dot"></div>
  <div id="toast-msg"></div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/util.js"></script>
<script src="js/calc.js"></script>
<script src="js/rows.js"></script>
<script src="js/data.js"></script>
<script src="js/toast.js"></script>
<script src="js/connection.js"></script>
<script src="js/unsaved.js"></script>
<script src="js/typeahead.js"></script>
<script src="js/views/login.js"></script>
<script src="js/views/estimate-list.js"></script>
<script src="js/views/estimate-detail.js"></script>
<script src="js/views/estimate-editor.js"></script>
<script src="js/views/estimates.js"></script>
<script src="js/views/clients.js"></script>
<script src="js/views/pricing.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
