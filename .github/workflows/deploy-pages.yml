# Publishes web/ to GitHub Pages on every push to main that touches it.
#
# One-time manual setup this workflow depends on (see
# .design/nas-hosted-billing/DEPLOYMENT.md for the full write-up):
#   1. Settings -> Pages -> Source: GitHub Actions.
#   2. Settings -> Secrets and variables -> Actions -> New repository secret
#      named LSC_API_BASE, set to the HTTPS URL of the NAS API (the
#      Cloudflare Tunnel hostname), e.g. https://billing-api.example.com
#      No trailing slash — see web/js/config.example.js.
#
# web/js/config.js is gitignored (it would otherwise hardcode the NAS
# hostname into a public repo) and is generated here instead, from the
# secret above, each time this runs.
#
# Cache-busting: GitHub Pages does not let a deploy invalidate a browser's
# already-cached copy of a script. HANDOVER.md documents a real bug from a
# stale cached js/calc.js silently pricing an estimate with an old money
# model while the server used a new one. Every <script src="js/...\"> and
# <link href="css/...\"> in index.html gets a `?v=<short commit sha>` query
# string appended at build time, so a new deploy is always a new URL and
# never served from a stale cache — without needing a bundler.

name: Deploy web/ to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate js/config.js from the LSC_API_BASE secret
        env:
          LSC_API_BASE: ${{ secrets.LSC_API_BASE }}
        run: |
          if [ -z "$LSC_API_BASE" ]; then
            echo "::error::LSC_API_BASE repository secret is not set. See .design/nas-hosted-billing/DEPLOYMENT.md."
            exit 1
          fi
          cat > web/js/config.js <<EOF
          /* Generated by .github/workflows/deploy-pages.yml — do not edit by
           * hand or commit. See web/js/config.example.js for local dev. */
          window.LSC_API_BASE = '${LSC_API_BASE}';
          EOF

      - name: Cache-bust local script and stylesheet references
        run: |
          SHA="${GITHUB_SHA::8}"
          # Only rewrite same-origin local references (css/ or js/, not an
          # absolute URL), and only inside web/index.html.
          sed -i -E "s#(src=\"js/[^\"]+\.js)\"#\1?v=${SHA}\"#g; s#(href=\"css/[^\"]+\.css)\"#\1?v=${SHA}\"#g" web/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
